function mountMap(host, onSelect, opts = {}) {
  const useGoogle = !!CFG.GOOGLE_MAPS_API_KEY;
  const ctl = { select() {}, reset() {}, zoom() {}, mode: 'preview' };
  const buildPreview = () => {
    host.innerHTML = `<svg class="map" viewBox="0 0 ${MW} ${MH}" role="application" aria-label="Preview map of Bonifacio Global City showing three SILONG vending machines. Drag to pan, use the buttons to zoom.">${previewMapSVG()}</svg>
      <div class="map-ctl">
        <button class="icon-btn" type="button" data-map="in" aria-label="Zoom in">${ic('plus')}</button>
        <button class="icon-btn" type="button" data-map="out" aria-label="Zoom out">${ic('minus')}</button>
        <button class="icon-btn" type="button" data-map="fit" aria-label="Reset map view">${ic('fit')}</button>
      </div><span class="map-badge">Preview map</span>`;
    const svg = $('svg.map', host), layer = $('#mk-layer', svg);
    const home = (() => {
      if (!opts.fit) return { x: 0, y: 0, w: MW };
      const pts = [proj(CENTER.lat, CENTER.lng), ...KIOSKS.map((k) => proj(k.lat, k.lng))];
      const xs = pts.map((q) => q.x), ys = pts.map((q) => q.y), pad = 130;
      const minx = Math.min(...xs) - pad, maxx = Math.max(...xs) + pad, miny = Math.min(...ys) - pad - 70, maxy = Math.max(...ys) + pad * .6;
      const w = Math.min(MW, Math.max(maxx - minx, (maxy - miny) * MW / MH));
      return { x: (minx + maxx) / 2 - w / 2, y: (miny + maxy) / 2 - w * MH / MW / 2, w };
    })();
    let vb = { x: home.x, y: home.y, w: home.w, h: home.w * MH / MW }, moved = false;
    const clamp = () => {
      vb.w = Math.min(MW, Math.max(180, vb.w)); vb.h = vb.w * MH / MW;
      vb.x = Math.min(MW - vb.w, Math.max(0, vb.x)); vb.y = Math.min(MH - vb.h, Math.max(0, vb.y));
    };
    const draw = () => {
      clamp();
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      const sc = vb.w / MW * 1.25, cp = proj(CENTER.lat, CENTER.lng);
      $('#mk-c', layer).setAttribute('transform', `translate(${cp.x} ${cp.y}) scale(${sc})`);
      KIOSKS.forEach((k) => {
        const g = $(`.mk[data-k="${k.id}"]`, layer), p = proj(k.lat, k.lng), on = k.id === S.sel;
        g.setAttribute('transform', `translate(${p.x} ${p.y}) scale(${sc * (on ? 1.18 : 1)})`); g.classList.toggle('sel', on);
      });
    };
    const zoomAt = (f, cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2) => {
      const nw = Math.min(MW, Math.max(180, vb.w * f)), r = nw / vb.w;
      vb.x = cx - (cx - vb.x) * r; vb.y = cy - (cy - vb.y) * r; vb.w = nw; draw();
    };
    const animateTo = (t) => {
      const from = { ...vb }, t0 = performance.now(), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const step = (now) => {
        const k = reduce ? 1 : Math.min(1, (now - t0) / 260), e = 1 - Math.pow(1 - k, 3);
        vb.x = from.x + (t.x - from.x) * e; vb.y = from.y + (t.y - from.y) * e; vb.w = from.w + (t.w - from.w) * e; draw();
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    ctl.select = (id) => {
      const k = kiosk(id), p = proj(k.lat, k.lng), w = Math.min(vb.w, 460), h = w * MH / MW;
      animateTo({ x: p.x - w / 2, y: p.y - h * 0.62, w });
    };
    ctl.reset = () => animateTo({ ...home });
    ctl.redraw = draw;
    /* GPS works without internet, so "Find the one nearest me" works on this map too */
    ctl.locate = () => {
      if (!navigator.geolocation) { toast('Location isn’t available on this device.'); return; }
      toast('Finding you…');
      navigator.geolocation.getCurrentPosition((pos) => {
        if (!host.isConnected) return;
        const n = nearestKiosk(pos.coords.latitude, pos.coords.longitude);
        S.sel = n.k.id; ctl.select(n.k.id); draw();
        $$('.loc[data-loc]').forEach((x) => x.classList.toggle('sel', x.dataset.loc === n.k.id));
        toast(`Nearest: Silongan ${n.k.id}, ${fmtDist(n.m)} away, about ${walkMin(n.m)} min on foot.`);
      }, () => toast('Couldn’t get your location. Allow location access and try again.'), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    };
    let drag = null;
    svg.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y }; moved = false; });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 5) { moved = true; svg.classList.add('drag'); }
      if (!moved) return;
      const rect = svg.getBoundingClientRect(), k = Math.max(vb.w / rect.width, vb.h / rect.height);
      vb.x = drag.vx - dx * k; vb.y = drag.vy - dy * k; draw();
    });
    const end = () => { drag = null; svg.classList.remove('drag'); };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointerleave', end); svg.addEventListener('pointercancel', end);
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 0.8 : 1.25, vb.x + (e.clientX - rect.left) / rect.width * vb.w, vb.y + (e.clientY - rect.top) / rect.height * vb.h);
    }, { passive: false });
    svg.addEventListener('click', (e) => { if (moved) { moved = false; return; } const g = e.target.closest('.mk'); if (g) onSelect(g.dataset.k); });
    svg.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.mk')) { e.preventDefault(); onSelect(e.target.dataset.k); } });
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-map]'); if (!b) return;
      if (b.dataset.map === 'in') zoomAt(0.7); else if (b.dataset.map === 'out') zoomAt(1.4); else ctl.reset();
    });
    const cp0 = proj(CENTER.lat, CENTER.lng);
    const routes = host.classList.contains('cool') ? KIOSKS.map((k, i) => { const q = proj(k.lat, k.lng); return `<path class="route r${i}" d="M${cp0.x} ${cp0.y} H${q.x} V${q.y}" pathLength="100"/>`; }).join('') : '';
    layer.innerHTML = routes + centerMarkerSVG() + KIOSKS.map(markerSVG).join('');
    draw();
  };

  const buildGoogle = () => {
    host.innerHTML = '<div id="gmap" role="application" aria-label="Google Map of Bonifacio Global City with SILONG vending machines"></div><span class="map-badge">Google Maps</span>';
    ctl.mode = 'google';
    let gm, markers = {};
    const init = () => {
      const g = window.google.maps;
      gm = new g.Map($('#gmap', host), { center: { lat: CENTER.lat, lng: CENTER.lng }, zoom: 17, mapTypeControl: false, streetViewControl: false, fullscreenControl: false });
      new g.Marker({ position: { lat: CENTER.lat, lng: CENTER.lng }, map: gm, title: CENTER.name });
      KIOSKS.forEach((k) => {
        const m = new g.Marker({ position: { lat: k.lat, lng: k.lng }, map: gm, title: k.name + ' – ' + k.title, label: { text: k.id, color: '#fff', fontWeight: '800' },
          icon: { url: new URL(k.emblem, location.href).href, scaledSize: new g.Size(44, 44), labelOrigin: new g.Point(36, 6) } });
        m.addListener('click', () => onSelect(k.id)); markers[k.id] = m;
      });
      ctl.select = (id) => { const k = kiosk(id); gm.panTo({ lat: k.lat, lng: k.lng }); gm.setZoom(18); };
      ctl.reset = () => { gm.panTo({ lat: CENTER.lat, lng: CENTER.lng }); gm.setZoom(17); };
    };
    window.__silongMapsReady = init;
    window.gm_authFailure = () => { toast('Google Maps rejected the API key. Showing the preview map.'); buildPreview(); };
    if (window.google && window.google.maps) { init(); return; }
    const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(CFG.GOOGLE_MAPS_API_KEY) + '&callback=__silongMapsReady&loading=async';
    s.async = true; s.onerror = () => { toast('Google Maps could not load. Showing the preview map.'); buildPreview(); };
    document.head.appendChild(s);
  };
  /* Real streets from OpenStreetMap, drawn by Leaflet. No key needed. */
  const buildLeaflet = () => {
    ctl.mode = 'osm';
    host.innerHTML = `<div class="lmap" role="application" aria-label="Map of Bonifacio Global City with the SILONG vending machines"></div>
      <div class="map-ctl"><button class="icon-btn" type="button" data-lmap="locate" aria-label="Find the Silongan nearest me">${ic('nav')}</button><button class="icon-btn" type="button" data-lmap="fit" aria-label="Show all Silongans">${ic('fit')}</button></div>`;
    loadCSS(LIBS.leafletCSS);
    within(loadScript(LIBS.leafletJS), 10000).then(() => {
      if (!host.isConnected) return;
      const Lf = window.L, map = Lf.map($('.lmap', host), { zoomControl: false, scrollWheelZoom: !opts.fit }).setView([CENTER.lat, CENTER.lng], 17);
      (S.lmaps = S.lmaps || []).push(map);
      Lf.control.zoom({ position: 'bottomright' }).addTo(map);
      const tiles = Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: 'anonymous',
        attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(map);
      /* Connected but no internet (Wi-Fi without internet, mobile data with no load): no map pictures arrive,
         so switch to the built-in map instead of showing an empty grid. */
      let tilesIn = 0, tilesFailed = 0, gaveUp = false;
      const giveUp = () => { if (gaveUp || tilesIn || !host.isConnected) return; gaveUp = true; ctl.mode = 'preview'; buildPreview(); setTimeout(() => { try { map.remove(); } catch (e) { /* already gone */ } }, 600); if (S.sel && !opts.fit) ctl.select(S.sel); };
      tiles.on('tileload', () => { tilesIn++; }).on('tileerror', () => { tilesFailed++; if (tilesFailed >= 4) giveUp(); });
      setTimeout(() => { if (tilesFailed) giveUp(); }, 8000);
      const markers = {};
      KIOSKS.forEach((k) => {
        const icon = Lf.divIcon({ className: 'lmk', html: `<span class="lmk-pin"><img src="${k.emblem}" alt=""><b>${k.id}</b></span>`, iconSize: [46, 56], iconAnchor: [23, 56] });
        markers[k.id] = Lf.marker([k.lat, k.lng], { icon, title: 'Silongan ' + k.id, alt: 'Silongan ' + k.id, riseOnHover: true }).addTo(map).on('click', () => onSelect(k.id));
      });
      const bounds = Lf.latLngBounds(KIOSKS.map((k) => [k.lat, k.lng])).pad(opts.fit ? 0.8 : 0.5);
      const mark = (id) => Object.entries(markers).forEach(([mid, m]) => { const e = m.getElement(); if (e) e.classList.toggle('sel', mid === id); });
      map.fitBounds(bounds, { animate: false });
      ctl.select = (id) => { const k = kiosk(id); mark(id); map.flyTo([k.lat, k.lng], 18, { duration: calm() ? 0 : 0.6 }); };
      ctl.reset = () => map.flyToBounds(bounds, { duration: calm() ? 0 : 0.6 });
      ctl.redraw = () => map.invalidateSize();
      let me = null;
      ctl.locate = () => {
        if (!navigator.geolocation) { toast('Location isn’t available on this device.'); return; }
        toast('Finding you…');
        navigator.geolocation.getCurrentPosition((pos) => {
          if (!host.isConnected) return;
          const here = [pos.coords.latitude, pos.coords.longitude], n = nearestKiosk(here[0], here[1]);
          if (me) me.setLatLng(here);
          else me = Lf.marker(here, { icon: Lf.divIcon({ className: 'lmk', html: '<span class="me-dot"></span>', iconSize: [18, 18], iconAnchor: [9, 9] }), title: 'You are here', interactive: false }).addTo(map);
          mark(n.k.id); map.flyToBounds(Lf.latLngBounds([here, [n.k.lat, n.k.lng]]).pad(0.35), { maxZoom: 18, duration: calm() ? 0 : 0.8 });
          S.sel = n.k.id; $$('.loc[data-loc]').forEach((x) => x.classList.toggle('sel', x.dataset.loc === n.k.id));
          toast(`Nearest: Silongan ${n.k.id}, ${fmtDist(n.m)} away, about ${walkMin(n.m)} min on foot.`);
        }, () => toast('Couldn’t get your location. Allow location access and try again.'), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
      };
      host.addEventListener('click', (e) => { const b = e.target.closest('[data-lmap]'); if (!b) return; if (b.dataset.lmap === 'fit') ctl.reset(); else ctl.locate(); });
      setTimeout(() => { if (!gaveUp) map.invalidateSize(); }, 150);
      if (!opts.fit && S.sel) mark(S.sel);
    }).catch(() => { if (host.isConnected) { ctl.mode = 'preview'; buildPreview(); } });
  };
  useGoogle ? buildGoogle() : (navigator.onLine === false ? buildPreview() : buildLeaflet());
  return ctl;
}

    if (kind === 'rain' || (d.pop != null && d.pop >= 40)) { tip.hidden = false; tip.innerHTML = 'Rain is likely. <a href="#locations" data-go="locations">Find the nearest Silongan</a>'; }
    else if (d.uv != null && d.uv >= 6) { tip.hidden = false; tip.innerHTML = (d.uv >= 8 ? 'Very strong' : 'Strong') + ' sun today, UV peak ' + Math.round(d.uv) + '. An umbrella doubles as shade. <a href="#locations" data-go="locations">Find the nearest Silongan</a>'; }
  } else if (Wx.status === 'loading' || Wx.status === 'idle') {
    $('#sky-temp').textContent = '—'; $('#sky-desc').textContent = 'Checking the weather\u2026'; $('#sky-extra').textContent = 'Live weather from Open-Meteo.';
  } else {
    $('#sky-temp').textContent = ''; $('#sky-desc').textContent = 'Weather unavailable';
    $('#sky-extra').textContent = Wx.status === 'off' ? 'Weather is turned off in this prototype.' : 'Live weather isn’t available right now. Sunrise and sunset still work.';
  }
  $('#sun-g').setAttribute('class', s.night ? 'moon' : 'sun');
  cancelAnimationFrame(skyAnim);
  if (!animate || matchMedia('(prefers-reduced-motion: reduce)').matches) { placeSun(s.t); return; }
  const t0 = performance.now(), dur = 1500;
  const step = (n) => { const k = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - k, 3); placeSun(s.t * e); if (k < 1) skyAnim = requestAnimationFrame(step); };
  skyAnim = requestAnimationFrame(step);
}

  loadWeather().then(() => { if (S.route === 'home') paintSky(false); });

/* ------------------------------ 6. ROUTING + EVENTS ------------------------------ */
function route() {
  S.user = Auth.current();
  /* a printed SILONG QR opens the site at #scan=A: remember the machine, then offer to unlock it */
  const scan = /^#scan=([a-z])$/i.exec(location.hash);
  if (scan && kiosk(scan[1].toUpperCase())) { S.pendingScan = scan[1].toUpperCase(); Stats.event('qr_link'); history.replaceState(null, '', S.user || LIVE ? '#home' : '#welcome'); }
  const r = location.hash.replace('#', '');
  if (!S.user && LIVE) {
    /* the real app: guests look around freely; only logging in and signing up have their own screens */
    if (r === 'login' || r === 'register') { S.route = r; renderAuth(r); window.scrollTo(0, 0); return; }
  } else if (!S.user) {
    if (!['welcome', 'login', 'register'].includes(r)) { history.replaceState(null, '', '#welcome'); return renderAuth('welcome'); }
    S.route = r; renderAuth(r); window.scrollTo(0, 0); return;
  }
  if (!VIEWS[r]) { history.replaceState(null, '', '#home'); S.route = 'home'; }
  else S.route = r;
  if (!S.shell || !$('#view-host')) buildShell();
  renderView(); window.scrollTo(0, 0);
  if (S.pendingScan) { const id = S.pendingScan; S.pendingScan = null; setTimeout(() => scannedAt(id), 350); }
}
function navigate(id) {
  if (location.hash === '#' + id) route(); else location.hash = id;
}
window.addEventListener('hashchange', () => { closeModal(true); route(); });

async function handleForm(form) {
  const kind = form.dataset.form, val = (id) => ($('#' + id).value || '');
  const btn = $('button[type="submit"]', form);
  if (kind === 'register') {
    const e = { 'rg-name': V.name(val('rg-name')), 'rg-email': V.email(val('rg-email')), 'rg-mobile': LIVE && !val('rg-mobile').trim() ? '' : V.mobile(val('rg-mobile')), 'rg-pass': V.password(val('rg-pass')) };
    Object.entries(e).forEach(([k, m]) => setErr(k, m));
    const t = $('#rg-terms').checked; setErr('rg-terms', t ? '' : 'Please agree to the Terms and Conditions to continue.');
    if (Object.values(e).some(Boolean) || !t) { const f = $('[aria-invalid="true"]', form); if (f) f.focus(); return; }
    btn.disabled = true;
    try { S.user = await Auth.register({ name: val('rg-name').trim(), email: val('rg-email').trim(), mobile: val('rg-mobile').trim() ? normMobile(val('rg-mobile')) : '', password: val('rg-pass'), launch: LIVE ? $('#rg-launch').checked : undefined }); Stats.event('signup'); toast('Account created. Welcome to SILONG!'); navigate('home'); }
    catch (err) { $('#rg-form-err').textContent = err.message; btn.disabled = false; }
  } else if (kind === 'login') {
    const e = { 'lg-email': V.email(val('lg-email')), 'lg-pass': val('lg-pass') ? '' : 'Enter your password.' };
    Object.entries(e).forEach(([k, m]) => setErr(k, m)); $('#lg-form-err').textContent = '';
    if (Object.values(e).some(Boolean)) { $('[aria-invalid="true"]', form).focus(); return; }
    btn.disabled = true;
    try { await Auth.login(val('lg-email').trim(), val('lg-pass')); navigate('home'); }
    catch (err) { $('#lg-form-err').textContent = err.message; btn.disabled = false; }
  } else if (kind === 'profile') {
    const np = val('pf-pass');
    const e = { 'pf-name': V.name(val('pf-name')), 'pf-email': V.email(val('pf-email')), 'pf-mobile': LIVE && !val('pf-mobile').trim() ? '' : V.mobile(val('pf-mobile')), 'pf-pass': np ? V.password(np) : '' };
    Object.entries(e).forEach(([k, m]) => setErr(k, m));
    if (Object.values(e).some(Boolean)) { $('[aria-invalid="true"]', form).focus(); return; }
    try {
      S.user = await Auth.update(S.user.id, { name: val('pf-name').trim(), email: val('pf-email').trim(), mobile: val('pf-mobile').trim() ? normMobile(val('pf-mobile')) : '', newPassword: np });
      S.shell = false; route(); toast('Profile updated.');
    } catch (err) { setErr('pf-email', err.message); }
  } else if (kind === 'support') {
    const e = { 'sp-name': V.name(val('sp-name')), 'sp-email': V.email(val('sp-email')), 'sp-cat': val('sp-cat') ? '' : 'Choose a category.', 'sp-msg': val('sp-msg').trim().length >= 10 ? '' : 'Tell us a little more (at least 10 characters).' };
    Object.entries(e).forEach(([k, m]) => setErr(k, m));
    if (Object.values(e).some(Boolean)) { $('[aria-invalid="true"]', form).focus(); return; }
    const ref = L('DEMO-', 'SLG-') + uid().slice(0, 6).toUpperCase();
    if (!LIVE) Support.submit({ ref, userId: S.user ? S.user.id : null, name: val('sp-name'), email: val('sp-email'), category: val('sp-cat'), txRef: val('sp-ref'), message: val('sp-msg'), at: Date.now() });
    btn.disabled = true;
    const sent = Cloud.on ? await Cloud.ticket({ name: val('sp-name'), email: val('sp-email'), category: val('sp-cat'), txRef: val('sp-ref'), message: val('sp-msg'), ticket: ref }).catch(() => false) : false;
    btn.disabled = false;
    if (LIVE && !sent) { $('#sp-done').innerHTML = `<div class="notice warn">${ic('info', 'sm')}<span>Your message couldn’t be sent. Check your connection and try again.</span></div>`; return; }
    $('#sp-done').innerHTML = sent
      ? `<div class="notice">${ic('check', 'sm')}<span><b>Sent to the SILONG team (${ref}).</b> We’ll reply to ${esc(val('sp-email'))}.</span></div>`
      : `<div class="notice">${ic('check', 'sm')}<span><b>Saved on this device (${ref}).</b> This is a demo. Your message has not been sent to the SILONG support team because no support system is connected yet.</span></div>`;
    $('#sp-msg').value = ''; $('#sp-ref').value = ''; S.topic = '';
  }
}

    case 'do-topup': {
      const m = $('.modal'), cv = $('#tu-custom', m).value.trim(), ch = $('input[name="tu-amt"]:checked', m);

const Ask = { log: [] };

const askGo = (id, label) => `<a class="btn secondary sm" href="#${id}" data-go="${id}">${label}</a>`;
function askChips() {
  const r = S.user ? activeRental() : null;
  const qs = [LIVE ? ['When does SILONG launch?', 'Kailan magbubukas ang SILONG?'] : r ? ['How much do I owe now?', 'Magkano na ang utang ko?'] : ['How do I rent an umbrella?', 'Paano magrenta ng payong?'], ['How much for 2 hours?', 'Magkano para sa 2 oras?'],
    ['Where is the nearest Silongan?', 'Saan ang pinakamalapit na Silongan?'], ['Will it rain today?', 'Uulan ba ngayon?'], ['What if I lose it?', 'Paano kung mawala ko?'], ['Can I pay with cash?', 'Puwede bang cash?']];
  return qs.map(([en, tl]) => { const q = bi(en, tl); return `<button class="ask-chip" type="button" data-action="ask-chip" data-q="${esc(q)}">${esc(q)}</button>`; }).join('');

function askWeather() {
  const d = Wx.data;
  if (Wx.status !== 'ok' || !d) { loadWeather(); return bi('I can’t reach the weather service right now. Try again in a minute, or check Today in BGC on the Home page.', 'Hindi ko maabot ang weather service ngayon. Subukan ulit mamaya, o tingnan ang Ngayon sa BGC sa Home.'); }
  const sky = tr(wxDescribe(d.code)[0]).toLowerCase(), uv = d.uv != null ? Math.round(d.uv) : null;
  const rain = d.pop != null ? bi(`, with a ${d.pop}% chance of rain today`, `, may ${d.pop}% tsansa ng ulan ngayong araw`) : '';
  const tip = d.pop != null && d.pop >= 40 ? bi(' Rain is likely, so grab an umbrella at a Silongan.', ' Malamang umulan, kaya kumuha ng payong sa isang Silongan.')
    : uv != null && uv >= 6 ? bi(` Strong sun though (UV peak ${uv}), and an umbrella doubles as shade.`, ` Pero matindi ang araw (UV peak ${uv}), at panangga rin sa init ang payong.`)
    : bi(' Looks fine, but the Silongans are there if the sky changes its mind.', ' Mukhang maayos, pero nandiyan ang mga Silongan kung magbago ang panahon.');

function askRender() {
  const log = $('#ask-log'); if (!log) return;
  log.innerHTML = Ask.log.map((m) => m.me ? `<div class="ask-msg me"><div class="bub">${esc(m.text)}</div></div>`
    : `<div class="ask-msg kuya">${askFace()}<div class="bub">${m.html}</div></div>`).join('');
  log.scrollTop = log.scrollHeight;
  const c = $('#ask-chips'); if (c) c.innerHTML = askChips();
}
function askSend(text) {
  const q = String(text || '').trim().slice(0, 200); if (!q) return;
  Ask.log.push({ me: true, text: q }, { html: `<span class="ask-typing">${bi('Kuya Silong is typing…', 'Nagta-type si Kuya Silong…')}</span>`, typing: true });
  askRender(); Stats.event('ask');
  setTimeout(() => { Ask.log = Ask.log.filter((x) => !x.typing); Ask.log.push({ html: askAnswer(q) }); askRender(); }, calm() ? 0 : 450);
}
function openHelper() {
  const first = S.user ? ', ' + esc(S.user.name.trim().split(/\s+/)[0]) : '';
  if (!Ask.log.length) Ask.log.push({ html: bi(`Mabuhay${first}! Ako si Kuya Silong. Ask me anything about renting an umbrella, or tap a question below.`, `Mabuhay${first}! Ako si Kuya Silong. Magtanong ka tungkol sa pag-renta ng payong, o pumili ng tanong sa ibaba.`) });
  /* on touch screens, don't pop the keyboard open before they've seen the suggested questions */
  const focusInput = matchMedia('(hover: hover)').matches ? 'data-autofocus' : '';
  openModal({ label: 'Ask Kuya Silong', html: `
    <div class="modal-head"><div class="row" style="gap:12px;flex-wrap:nowrap">${askFace()}<div><span class="eyebrow">SILONG helper</span><h2>Ask Kuya Silong</h2></div></div><button class="icon-btn" type="button" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="ask-log" id="ask-log" role="log" aria-live="polite"></div>
    <div class="ask-chips" id="ask-chips" aria-label="Suggested questions"></div>
    <form class="ask-form" id="ask-form" autocomplete="off"><input class="input" id="ask-input" aria-label="Your question" placeholder="Magtanong… e.g. How much for 2 hours?" maxlength="200" enterkeyhint="send" ${focusInput}><button class="btn" type="submit">Send</button></form>
    <p class="muted small" style="margin:0">${L('Kuya Silong answers from SILONG’s help pages and your demo rental, right on this device.', 'Kuya Silong answers from SILONG’s help pages, right on this device.')}</p>` });
  askRender();
}
document.addEventListener('submit', (e) => {
  if (!e.target || e.target.id !== 'ask-form') return;
  e.preventDefault(); const i = $('#ask-input'); const q = i.value; i.value = ''; askSend(q); i.focus({ preventScroll: true });
});

const Mascot = (() => {

  const P = { x: 0, y: 0, tx: 0, ty: 0, vx: 0 }, last = { t: 0, type: 'mouse' }, calmNow = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LINES = ['Mabuhay!', 'Kumusta!', 'Ingat sa ulan!', 'Tara na!', 'Salamat po!', 'Handa ka na sa ulan?'];
  const ROUTE = { home: 'Kumusta! Tingnan natin ang panahon.', locations: 'Tara, hanap tayo ng Silongan!', rates: 'Mula ₱15 lang ang unang oras.', rentals: 'Ibalik sa kahit anong Silongan!', wallet: 'Sisingilin ka lang pagbalik.', how: 'Madali lang, promise!', support: 'Nandito kami para tumulong.', account: 'Ikaw ba ‘yan? Ang pogi/ganda!' };

    <g class="m-leg r"><rect x="64" y="116" width="11" height="22" rx="5.5" fill="#d99a62"/><ellipse cx="71" cy="139" rx="9" ry="5" fill="#2b2b3a"/></g>
    <rect x="42" y="102" width="38" height="20" rx="8" fill="#0038a8"/>
    <g class="m-arm-l"><path d="M44 90 Q34 100 34 110" stroke="#d99a62" stroke-width="9" stroke-linecap="round" fill="none"/></g>
    <rect x="40" y="76" width="42" height="42" rx="15" fill="#fff" stroke="#d3dcec" stroke-width="1.5"/>
    <path d="M52 77 L61 90 L70 77" fill="none" stroke="#ce1126" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M61 90 V116" stroke="#e5ebf6" stroke-width="1.6"/><circle cx="61" cy="98" r="1.6" fill="#fcd116"/><circle cx="61" cy="106" r="1.6" fill="#fcd116"/>
    <g class="m-arm-r"><rect x="95" y="14" width="3.2" height="92" rx="1.6" fill="#b88a4a"/><circle cx="96.6" cy="12.5" r="3" fill="#fcd116"/>
      <g transform="translate(98.6 16)"><g class="m-flag"><g class="m-wave"><rect width="46" height="15" fill="#0038a8"/><rect y="15" width="46" height="15" fill="#ce1126"/><path d="M0 0 L26 15 L0 30Z" fill="#fff"/>
<g fill="#fcd116" stroke="#fcd116"><circle cx="8" cy="15" r="3.3" stroke="none"/><g stroke-width="1.2" stroke-linecap="round"><line x1="12.20" y1="15.00" x2="15.40" y2="15.00"/><line x1="10.97" y1="17.97" x2="13.23" y2="20.23"/><line x1="8.00" y1="19.20" x2="8.00" y2="22.40"/><line x1="5.03" y1="17.97" x2="2.77" y2="20.23"/><line x1="3.80" y1="15.00" x2="0.60" y2="15.00"/><line x1="5.03" y1="12.03" x2="2.77" y2="9.77"/><line x1="8.00" y1="10.80" x2="8.00" y2="7.60"/><line x1="10.97" y1="12.03" x2="13.23" y2="9.77"/></g><polygon points="2.90,2.00 3.51,3.76 5.37,3.80 3.89,4.92 4.43,6.70 2.90,5.64 1.37,6.70 1.91,4.92 0.43,3.80 2.29,3.76"/><polygon points="2.90,22.80 3.51,24.56 5.37,24.60 3.89,25.72 4.43,27.50 2.90,26.44 1.37,27.50 1.91,25.72 0.43,24.60 2.29,24.56"/><polygon points="21.20,12.40 21.81,14.16 23.67,14.20 22.19,15.32 22.73,17.10 21.20,16.04 19.67,17.10 20.21,15.32 18.73,14.20 20.59,14.16"/></g></g></g></g>
      <path d="M76 88 Q88 90 96.6 84" stroke="#d99a62" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="96.6" cy="84" r="5.4" fill="#d99a62"/></g>
    <g class="m-head"><circle cx="60" cy="56" r="26" fill="#d99a62"/>
      <path d="M34 54 Q36 30 60 29 Q84 30 86 54 Q78 40 60 41 Q42 40 34 54Z" fill="#1c1a22"/>
      <ellipse cx="29.5" cy="58" rx="3.6" ry="5" fill="#d99a62"/><ellipse cx="90.5" cy="58" rx="3.6" ry="5" fill="#d99a62"/>

        <g class="m-eye"><ellipse cx="70" cy="58" rx="4.6" ry="5.4" fill="#1c1a22"/><circle class="m-pupil" cx="71.5" cy="56" r="1.6" fill="#fff"/></g></g>
      <circle cx="42" cy="66" r="4.4" fill="#ff8a7a" opacity=".6"/><circle cx="78" cy="66" r="4.4" fill="#ff8a7a" opacity=".6"/>
      <path class="m-mouth" d="M53 68 Q60 76 67 68" fill="#8a2b2b" stroke="#8a2b2b" stroke-width="1.8" stroke-linejoin="round"/>
      <g class="m-hat"><ellipse cx="60" cy="33" rx="36" ry="9" fill="#e8b84a"/><path d="M34 33 Q38 10 60 7 Q82 10 86 33Z" fill="#f2c95f"/>
        <path d="M40 27 Q60 33 80 27M44 18 Q60 23 76 18" fill="none" stroke="#c99a2e" stroke-width="1.4"/><path d="M35 31 Q60 40 85 31" fill="none" stroke="#ce1126" stroke-width="3.4"/>
        <circle cx="60" cy="7.5" r="2.8" fill="#ce1126"/></g></g></svg>`;
  function build() {
    el = document.createElement('div'); el.id = 'mascot'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'Kuya Silong, a cartoon mascot holding the Philippine flag');
    el.innerHTML = `<div class="m-bubble" hidden></div><div class="m-in">${SVG}</div>`;
    document.body.appendChild(el); inner = $('.m-in', el); bubble = $('.m-bubble', el);
    el.addEventListener('click', () => { hop(); openHelper(); });
    P.x = P.tx = innerWidth - 120; P.y = P.ty = innerHeight - 220;
  }
  const size = () => (innerWidth < 700 ? 62 : 92);
  const park = () => {
    const dock = document.querySelector('.mascot-dock'), b = dock && dock.getBoundingClientRect(), docked = !!(b && b.width && b.height);

  function frame() {
    if (el && on) {

      if (idle) { const k = park(); P.tx = k.x; P.ty = k.y; }

      const moving = Math.abs(P.vx) > .35 || Math.abs(P.ty - P.y) > 2;
      el.style.transform = `translate(${P.x.toFixed(1)}px, ${P.y.toFixed(1)}px)`;
      el.classList.toggle('walk', moving && !calm); el.classList.toggle('idle', idle);
      el.style.setProperty('--tilt', Math.max(-9, Math.min(9, P.vx * 1.6)).toFixed(1) + 'deg');
      el.style.setProperty('--look', Math.max(-1, Math.min(1, (P.tx - P.x) / 80)).toFixed(2));
      el.hidden = !!document.querySelector('.auth2.form');
    }

  }
  function init() {
    build(); el.hidden = !on; el.style.display = on ? '' : 'none'; document.body.classList.toggle('no-mascot', !on);

  if (m) m.textContent = i.main; if (s) s.textContent = i.sub; if (b) b.style.width = i.pct + '%';
